name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver (e.g. 1.2.3 or v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Validate and normalize version
        id: version
        run: |
          set -euo pipefail
          raw="${{ github.event.inputs.version }}"
          ver="${raw#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a valid semver"
            exit 1
          fi
          tag="v$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if tag already exists
        run: |
          set -euo pipefail
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Bump Cargo.toml + Cargo.lock and tag
        run: |
          set -euo pipefail
          cargo install cargo-edit --locked
          cargo set-version "$VERSION"
          cargo update -p mxbattery
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_PASSWORD }}

      - name: Build signed .app
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_NAME }}
        run: ./tools/make-app.sh

      - name: Notarize and staple .app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent target/release/MXBattery.app /tmp/MXBattery-app.zip
          xcrun notarytool submit /tmp/MXBattery-app.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait
          xcrun stapler staple target/release/MXBattery.app
          xcrun stapler validate target/release/MXBattery.app
          spctl --assess --verbose --type execute target/release/MXBattery.app

      - name: Build, sign, notarize, staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_APP_SPECIFIC_PASSWORD }}
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_NAME }}
        run: |
          set -euo pipefail
          brew install create-dmg
          dmg="MXBattery-$TAG.dmg"
          create-dmg \
            --volname "MXBattery $TAG" \
            --window-size 540 380 \
            --icon "MXBattery.app" 140 190 \
            --app-drop-link 400 190 \
            "$dmg" \
            target/release/MXBattery.app
          codesign --force --sign "Developer ID Application: $DEVELOPER_ID" --options runtime "$dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: ${{ env.DMG }}
